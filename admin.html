<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة تحكم أبيان سبورت</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        .container {
            width: min(1100px, 94%);
            margin: 25px auto;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .08);
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header h1 {
            margin: 0;
        }

        .user-info {
            color: #475569;
            margin: 8px 0 0;
        }

        .hidden {
            display: none !important;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            background: #fff;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #2563eb;
            color: white;
            margin-top: 12px;
        }

        button:hover {
            opacity: .9;
        }

        .btn-secondary {
            background: #475569;
        }

        .btn-success {
            background: #16a34a;
        }

        .btn-danger {
            background: #dc2626;
        }

        .btn-warning {
            background: #d97706;
        }

        .btn-dark {
            background: #0f172a;
        }

        .top-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .top-buttons button {
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .message {
            margin-top: 12px;
            padding: 11px;
            border-radius: 10px;
            background: #f8fafc;
            min-height: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .match,
        .team {
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 17px;
            margin-top: 14px;
            background: #fff;
        }

        .match-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .match-info {
            color: #475569;
            line-height: 1.9;
            margin-bottom: 10px;
        }

        .score {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions button {
            flex: 1;
            min-width: 130px;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .team-logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            padding: 5px;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        .preview {
            margin-top: 12px;
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            padding: 5px;
            background: #f8fafc;
        }

        .logout {
            margin-top: 0;
        }

        .section-title {
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        @media (max-width: 700px) {
            .grid,
            .score,
            .top-buttons {
                grid-template-columns: 1fr;
            }

            .header {
                align-items: stretch;
            }

            .logout {
                width: 100%;
            }

            .team-row {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- تسجيل الدخول -->
    <div class="card" id="loginBox">

        <h1>⚽ أبيان سبورت</h1>

        <h2>تسجيل دخول المدير</h2>

        <label for="email">البريد الإلكتروني</label>
        <input
            id="email"
            type="email"
            placeholder="البريد الإلكتروني"
            autocomplete="email"
        >

        <label for="password">كلمة المرور</label>
        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >

        <button id="loginBtn" class="btn-dark">
            تسجيل الدخول
        </button>

        <div id="loginMessage" class="message"></div>

    </div>


    <!-- لوحة التحكم -->
    <div class="card hidden" id="adminBox">

        <div class="header">

            <div>
                <h1>⚽ لوحة تحكم أبيان سبورت</h1>
                <p id="userInfo" class="user-info"></p>
            </div>

            <button id="logoutBtn" class="btn-danger logout">
                تسجيل الخروج
            </button>

        </div>


        <!-- الأزرار الرئيسية -->
        <div class="top-buttons">

            <button id="showAddMatchBtn" class="btn-success">
                ➕ إضافة مباراة
            </button>

            <button id="showAddTeamBtn" class="btn-success">
                ⚽ إضافة فريق
            </button>

            <button id="loadAllBtn" class="btn-dark">
                🔄 تحديث البيانات
            </button>

        </div>

    </div>


    <!-- إضافة مباراة -->
    <div class="card hidden" id="addMatchBox">

        <h2 class="section-title">➕ إضافة مباراة جديدة</h2>

        <div class="grid">

            <div>
                <label for="matchHomeTeam">الفريق المضيف</label>
                <select id="matchHomeTeam">
                    <option value="">اختر الفريق المضيف</option>
                </select>
            </div>

            <div>
                <label for="matchAwayTeam">الفريق الضيف</label>
                <select id="matchAwayTeam">
                    <option value="">اختر الفريق الضيف</option>
                </select>
            </div>

            <div>
                <label for="matchDate">تاريخ المباراة</label>
                <input id="matchDate" type="date">
            </div>

            <div>
                <label for="matchTime">وقت المباراة</label>
                <input id="matchTime" type="time">
            </div>

            <div>
                <label for="matchStadium">الملعب</label>
                <input
                    id="matchStadium"
                    type="text"
                    placeholder="مثال: ملعب أبين"
                >
            </div>

            <div>
                <label for="matchStatus">حالة المباراة</label>
                <select id="matchStatus">
                    <option value="مجدولة">مجدولة</option>
                    <option value="مباشرة">مباشرة</option>
                    <option value="انتهت">انتهت</option>
                    <option value="ملغاة">ملغاة</option>
                </select>
            </div>

        </div>

        <button id="addMatchBtn" class="btn-success">
            حفظ المباراة
        </button>

        <button id="cancelMatchBtn" class="btn-secondary">
            إلغاء
        </button>

        <div id="addMatchMessage" class="message"></div>

    </div>


    <!-- إضافة فريق -->
    <div class="card hidden" id="addTeamBox">

        <h2 class="section-title">⚽ إضافة فريق جديد</h2>

        <div class="grid">

            <div>
                <label for="teamName">اسم الفريق</label>
                <input
                    id="teamName"
                    type="text"
                    placeholder="مثال: حسان أبين"
                >
            </div>

            <div>
                <label for="teamCity">المدينة</label>
                <input
                    id="teamCity"
                    type="text"
                    placeholder="مثال: أبين"
                >
            </div>

            <div>
                <label for="teamCoach">المدرب</label>
                <input
                    id="teamCoach"
                    type="text"
                    placeholder="اسم المدرب"
                >
            </div>

            <div>
                <label for="teamFounded">سنة التأسيس</label>
                <input
                    id="teamFounded"
                    type="number"
                    min="1800"
                    max="2100"
                    placeholder="مثال: 1995"
                >
            </div>

        </div>

        <label for="teamDescription">وصف الفريق</label>
        <textarea
            id="teamDescription"
            placeholder="اكتب نبذة عن الفريق..."
        ></textarea>

        <label for="teamLogo">شعار الفريق</label>
        <input
            id="teamLogo"
            type="file"
            accept="image/*"
        >

        <img
            id="logoPreview"
            class="preview hidden"
            alt="معاينة الشعار"
        >

        <button id="addTeamBtn" class="btn-success">
            حفظ الفريق
        </button>

        <button id="cancelTeamBtn" class="btn-secondary">
            إلغاء
        </button>

        <div id="addTeamMessage" class="message"></div>

    </div>


    <!-- المباريات -->
    <div class="card hidden" id="matchesBox">

        <div class="header">
            <h2>📋 المباريات</h2>

            <button id="loadMatchesBtn" class="btn-dark">
                🔄 تحميل المباريات
            </button>
        </div>

        <div id="matches"></div>

    </div>


    <!-- الفرق -->
    <div class="card hidden" id="teamsBox">

        <div class="header">
            <h2>🏆 الفرق</h2>

            <button id="loadTeamsBtn" class="btn-dark">
                🔄 تحميل الفرق
            </button>
        </div>

        <div id="teams"></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ujbgrwgxhusgoobhoanx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_oE8HsCGOsmRvIg0XwzymMA_I_33XlZ6";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginBox =
    document.getElementById("loginBox");

const adminBox =
    document.getElementById("adminBox");

const loginMessage =
    document.getElementById("loginMessage");

const userInfo =
    document.getElementById("userInfo");

const addMatchBox =
    document.getElementById("addMatchBox");

const addTeamBox =
    document.getElementById("addTeamBox");

const matchesBox =
    document.getElementById("matchesBox");

const teamsBox =
    document.getElementById("teamsBox");

const matchesContainer =
    document.getElementById("matches");

const teamsContainer =
    document.getElementById("teams");


/* =========================================================
   تسجيل الدخول
========================================================= */

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        showMessage(
            loginMessage,
            "اكتب البريد الإلكتروني وكلمة المرور.",
            "error"
        );

        return;
    }

    showMessage(
        loginMessage,
        "جاري تسجيل الدخول...",
        ""
    );

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        showMessage(
            loginMessage,
            "فشل تسجيل الدخول: " + error.message,
            "error"
        );

        return;
    }

    await checkAdmin(data.user);
}


/* =========================================================
   التحقق من المدير
========================================================= */

async function checkAdmin(user) {

    const { data, error } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();

    if (error) {

        showMessage(
            loginMessage,
            "حدث خطأ أثناء التحقق من صلاحية المدير: " +
            error.message,
            "error"
        );

        console.error(error);

        return;
    }

    if (!data) {

        showMessage(
            loginMessage,
            "هذا الحساب ليس مديرًا.",
            "error"
        );

        await supabaseClient.auth.signOut();

        return;
    }

    loginBox.classList.add("hidden");

    adminBox.classList.remove("hidden");

    userInfo.textContent =
        "تم تسجيل الدخول كمدير: " + user.email;

    matchesBox.classList.remove("hidden");
    teamsBox.classList.remove("hidden");

    await loadTeams();
    await loadMatches();
}


/* =========================================================
   التحقق من الجلسة عند فتح الصفحة
========================================================= */

async function checkExistingSession() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session && session.user) {
        await checkAdmin(session.user);
    }
}


/* =========================================================
   عرض / إخفاء النوافذ
========================================================= */

function showAddMatch() {

    addTeamBox.classList.add("hidden");

    addMatchBox.classList.remove("hidden");

    loadTeamsIntoSelects();

    window.scrollTo({
        top: addMatchBox.offsetTop - 15,
        behavior: "smooth"
    });
}


function showAddTeam() {

    addMatchBox.classList.add("hidden");

    addTeamBox.classList.remove("hidden");

    window.scrollTo({
        top: addTeamBox.offsetTop - 15,
        behavior: "smooth"
    });
}


function hideForms() {

    addMatchBox.classList.add("hidden");

    addTeamBox.classList.add("hidden");
}


/* =========================================================
   تحميل الفرق
========================================================= */

let allTeams = [];


async function loadTeams() {

    teamsContainer.innerHTML =
        '<div class="empty">جاري تحميل الفرق...</div>';

    const { data, error } =
        await supabaseClient
            .from("teams")
            .select("*")
            .order("name", {
                ascending: true
            });

    if (error) {

        teamsContainer.innerHTML =
            '<div class="empty error">فشل تحميل الفرق: ' +
            escapeHtml(error.message) +
            '</div>';

        console.error(error);

        return;
    }

    allTeams = data || [];

    renderTeams();

    loadTeamsIntoSelects();
}


function renderTeams() {

    if (!allTeams.length) {

        teamsContainer.innerHTML =
            '<div class="empty">لا توجد فرق حتى الآن.</div>';

        return;
    }

    teamsContainer.innerHTML = "";

    allTeams.forEach(team => {

        const div =
            document.createElement("div");

        div.className = "team";

        const logo =
            team.logo_url
                ? escapeHtml(team.logo_url)
                : "";

        div.innerHTML = `

            <div class="team-row">

                ${
                    logo
                    ?
                    `<img
                        class="team-logo"
                        src="${logo}"
                        alt="${escapeHtml(team.name)}"
                    >`
                    :
                    `<div class="team-logo"></div>`
                }

                <div style="flex:1">

                    <h3>
                        ${escapeHtml(team.name)}
                    </h3>

                    <div class="match-info">
                        ${
                            team.city
                            ? "📍 المدينة: " +
                              escapeHtml(team.city) +
                              "<br>"
                            : ""
                        }

                        ${
                            team.coach
                            ? "👤 المدرب: " +
                              escapeHtml(team.coach) +
                              "<br>"
                            : ""
                        }

                        ${
                            team.founded_year
                            ? "📅 التأسيس: " +
                              escapeHtml(team.founded_year) +
                              "<br>"
                            : ""
                        }

                        ${
                            team.description
                            ? escapeHtml(team.description)
                            : ""
                        }
                    </div>

                    <button
                        class="btn-danger"
                        onclick="deleteTeam(${team.id})"
                    >
                        🗑️ حذف الفريق
                    </button>

                </div>

            </div>
        `;

        teamsContainer.appendChild(div);

    });
}


/* =========================================================
   وضع الفرق داخل قوائم إضافة المباراة
========================================================= */

function loadTeamsIntoSelects() {

    const homeSelect =
        document.getElementById("matchHomeTeam");

    const awaySelect =
        document.getElementById("matchAwayTeam");

    if (!homeSelect || !awaySelect) {
        return;
    }

    homeSelect.innerHTML =
        '<option value="">اختر الفريق المضيف</option>';

    awaySelect.innerHTML =
        '<option value="">اختر الفريق الضيف</option>';

    allTeams.forEach(team => {

        const optionHome =
            document.createElement("option");

        optionHome.value =
            team.name;

        optionHome.textContent =
            team.name;

        homeSelect.appendChild(optionHome);


        const optionAway =
            document.createElement("option");

        optionAway.value =
            team.name;

        optionAway.textContent =
            team.name;

        awaySelect.appendChild(optionAway);

    });
}


/* =========================================================
   إضافة فريق
========================================================= */

async function addTeam() {

    const message =
        document.getElementById("addTeamMessage");

    const name =
        document.getElementById("teamName")
            .value
            .trim();

    const city =
        document.getElementById("teamCity")
            .value
            .trim();

    const coach =
        document.getElementById("teamCoach")
            .value
            .trim();

    const foundedValue =
        document.getElementById("teamFounded")
            .value
            .trim();

    const description =
        document.getElementById("teamDescription")
            .value
            .trim();

    const logoInput =
        document.getElementById("teamLogo");

    if (!name) {

        showMessage(
            message,
            "اكتب اسم الفريق.",
            "error"
        );

        return;
    }

    showMessage(
        message,
        "جاري إضافة الفريق...",
        ""
    );

    let logoUrl = null;


    /* رفع الشعار */

    if (
        logoInput.files &&
        logoInput.files.length > 0
    ) {

        const file =
            logoInput.files[0];

        if (!file.type.startsWith("image/")) {

            showMessage(
                message,
                "الملف المختار ليس صورة.",
                "error"
            );

            return;
        }

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        const safeName =
            name
                .replace(/[^\u0600-\u06FFa-zA-Z0-9]/g, "-")
                .replace(/-+/g, "-")
                .substring(0, 50);

        const filePath =
            Date.now() +
            "-" +
            safeName +
            "." +
            extension;


        const {
            error: uploadError
        } =
            await supabaseClient
                .storage
                .from("team-logos")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false
                    }
                );


        if (uploadError) {

            showMessage(
                message,
                "فشل رفع الشعار: " +
                uploadError.message,
                "error"
            );

            console.error(uploadError);

            return;
        }


        const {
            data: publicData
        } =
            supabaseClient
                .storage
                .from("team-logos")
                .getPublicUrl(filePath);

        logoUrl =
            publicData.publicUrl;
    }


    /* إدخال الفريق */

    const foundedYear =
        foundedValue
        ? Number(foundedValue)
        : null;


    const { error } =
        await supabaseClient
            .from("teams")
            .insert({
                name: name,
                logo_url: logoUrl,
                city: city || null,
                coach: coach || null,
                founded_year: foundedYear,
                description: description || null
            });


    if (error) {

        showMessage(
            message,
            "فشل إضافة الفريق: " +
            error.message,
            "error"
        );

        console.error(error);

        return;
    }


    showMessage(
        message,
        "✅ تم إضافة الفريق بنجاح.",
        "success"
    );


    document.getElementById("teamName").value = "";
    document.getElementById("teamCity").value = "";
    document.getElementById("teamCoach").value = "";
    document.getElementById("teamFounded").value = "";
    document.getElementById("teamDescription").value = "";
    document.getElementById("teamLogo").value = "";

    document.getElementById("logoPreview")
        .classList.add("hidden");


    await loadTeams();

}


/* =========================================================
   معاينة الشعار
========================================================= */

document
    .getElementById("teamLogo")
    .addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            const preview =
                document.getElementById("logoPreview");

            if (!file) {

                preview.classList.add("hidden");

                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function (event) {

                    preview.src =
                        event.target.result;

                    preview.classList.remove("hidden");
                };

            reader.readAsDataURL(file);
        }
    );


/* =========================================================
   حذف فريق
========================================================= */

async function deleteTeam(teamId) {

    const team =
        allTeams.find(
            item => item.id === teamId
        );

    if (!team) {
        return;
    }

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف فريق " +
            team.name +
            "؟"
        );

    if (!confirmed) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("teams")
            .delete()
            .eq("id", teamId);

    if (error) {

        alert(
            "فشل حذف الفريق: " +
            error.message
        );

        console.error(error);

        return;
    }

    await loadTeams();
}


/* =========================================================
   إضافة مباراة
========================================================= */

async function addMatch() {

    const message =
        document.getElementById("addMatchMessage");

    const homeTeam =
        document.getElementById("matchHomeTeam")
            .value;

    const awayTeam =
        document.getElementById("matchAwayTeam")
            .value;

    const matchDate =
        document.getElementById("matchDate")
            .value;

    const matchTime =
        document.getElementById("matchTime")
            .value;

    const stadium =
        document.getElementById("matchStadium")
            .value
            .trim();

    const status =
        document.getElementById("matchStatus")
            .value;


    if (!homeTeam) {

        showMessage(
            message,
            "اختر الفريق المضيف.",
            "error"
        );

        return;
    }


    if (!awayTeam) {

        showMessage(
            message,
            "اختر الفريق الضيف.",
            "error"
        );

        return;
    }


    if (homeTeam === awayTeam) {

        showMessage(
            message,
            "لا يمكن اختيار نفس الفريق في الطرفين.",
            "error"
        );

        return;
    }


    if (!matchDate) {

        showMessage(
            message,
            "اختر تاريخ المباراة.",
            "error"
        );

        return;
    }


    if (!matchTime) {

        showMessage(
            message,
            "اختر وقت المباراة.",
            "error"
        );

        return;
    }


    if (!stadium) {

        showMessage(
            message,
            "اكتب اسم الملعب.",
            "error"
        );

        return;
    }


    showMessage(
        message,
        "جاري حفظ المباراة...",
        ""
    );


    const { error } =
        await supabaseClient
            .from("matches")
            .insert({

                home_team: homeTeam,

                away_team: awayTeam,

                match_date: matchDate,

                match_time: matchTime,

                stadium: stadium,

                home_score: 0,

                away_score: 0,

                status: status

            });


    if (error) {

        showMessage(
            message,
            "فشل إضافة المباراة: " +
            error.message,
            "error"
        );

        console.error(error);

        return;
    }


    showMessage(
        message,
        "✅ تم إضافة المباراة بنجاح.",
        "success"
    );


    document.getElementById("matchHomeTeam")
        .value = "";

    document.getElementById("matchAwayTeam")
        .value = "";

    document.getElementById("matchDate")
        .value = "";

    document.getElementById("matchTime")
        .value = "";

    document.getElementById("matchStadium")
        .value = "";

    document.getElementById("matchStatus")
        .value = "مجدولة";


    await loadMatches();

}


/* =========================================================
   تحميل المباريات
========================================================= */

async function loadMatches() {

    matchesContainer.innerHTML =
        '<div class="empty">جاري تحميل المباريات...</div>';


    const { data, error } =
        await supabaseClient
            .from("matches")
            .select("*")
            .order("match_date", {
                ascending: true
            });


    if (error) {

        matchesContainer.innerHTML =
            '<div class="empty error">فشل تحميل المباريات: ' +
            escapeHtml(error.message) +
            '</div>';

        console.error(error);

        return;
    }


    if (!data || data.length === 0) {

        matchesContainer.innerHTML =
            '<div class="empty">لا توجد مباريات حتى الآن.</div>';

        return;
    }


    matchesContainer.innerHTML = "";


    data.forEach(match => {

        const div =
            document.createElement("div");

        div.className = "match";


        div.innerHTML = `

            <div class="match-title">

                ${escapeHtml(match.home_team)}

                🆚

                ${escapeHtml(match.away_team)}

            </div>


            <div class="match-info">

                📅 التاريخ:
                ${escapeHtml(match.match_date || "")}

                <br>

                🕐 الوقت:
                ${escapeHtml(match.match_time || "")}

                <br>

                🏟️ الملعب:
                ${escapeHtml(match.stadium || "")}

                <br>

                📌 الحالة:
                ${escapeHtml(match.status || "")}

            </div>


            <div class="score">

                <div>

                    <label>
                        نتيجة ${escapeHtml(match.home_team)}
                    </label>

                    <input
                        type="number"
                        min="0"
                        step="1"
                        id="home-${match.id}"
                        value="${Number.isInteger(match.home_score) ? match.home_score : 0}"
                    >

                </div>


                <div>

                    <label>
                        نتيجة ${escapeHtml(match.away_team)}
                    </label>

                    <input
                        type="number"
                        min="0"
                        step="1"
                        id="away-${match.id}"
                        value="${Number.isInteger(match.away_score) ? match.away_score : 0}"
                    >

                </div>

            </div>


            <div class="actions">

                <button
                    class="btn-success"
                    onclick="updateScore(${match.id})"
                >
                    💾 حفظ النتيجة
                </button>


                <button
                    class="btn-danger"
                    onclick="deleteMatch(${match.id})"
                >
                    🗑️ حذف المباراة
                </button>

            </div>


            <div
                id="message-${match.id}"
                class="message"
            ></div>

        `;


        matchesContainer.appendChild(div);

    });

}


/* =========================================================
   تحديث النتيجة
========================================================= */

async function updateScore(matchId) {

    const homeInput =
        document.getElementById(
            "home-" + matchId
        );

    const awayInput =
        document.getElementById(
            "away-" + matchId
        );

    const message =
        document.getElementById(
            "message-" + matchId
        );


    const homeScore =
        Number(homeInput.value);

    const awayScore =
        Number(awayInput.value);


    if (
        !Number.isInteger(homeScore) ||
        homeScore < 0 ||
        !Number.isInteger(awayScore) ||
        awayScore < 0
    ) {

        showMessage(
            message,
            "النتيجة غير صحيحة.",
            "error"
        );

        return;
    }


    showMessage(
        message,
        "جاري حفظ النتيجة...",
        ""
    );


    const { error } =
        await supabaseClient
            .from("matches")
            .update({

                home_score: homeScore,

                away_score: awayScore,

                status: "انتهت"

            })
            .eq("id", matchId);


    if (error) {

        showMessage(
            message,
            "فشل الحفظ: " +
            error.message,
            "error"
        );

        console.error(error);

        return;
    }


    showMessage(
        message,
        "✅ تم حفظ النتيجة بنجاح.",
        "success"
    );


    await loadMatches();

}


/* =========================================================
   حذف مباراة
========================================================= */

async function deleteMatch(matchId) {

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذه المباراة؟"
        );


    if (!confirmed) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("matches")
            .delete()
            .eq("id", matchId);


    if (error) {

        alert(
            "فشل حذف المباراة: " +
            error.message
        );

        console.error(error);

        return;
    }


    await loadMatches();

}


/* =========================================================
   تسجيل الخروج
========================================================= */

async function logout() {

    await supabaseClient.auth.signOut();

    adminBox.classList.add("hidden");

    addMatchBox.classList.add("hidden");

    addTeamBox.classList.add("hidden");

    matchesBox.classList.add("hidden");

    teamsBox.classList.add("hidden");

    loginBox.classList.remove("hidden");

    showMessage(
        loginMessage,
        "تم تسجيل الخروج.",
        "success"
    );
}


/* =========================================================
   الرسائل
========================================================= */

function showMessage(
    element,
    text,
    type
) {

    element.textContent = text;

    element.classList.remove(
        "success",
        "error"
    );

    if (type) {
        element.classList.add(type);
    }
}


/* =========================================================
   حماية عرض النصوص
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

   الأحداث
========================================================= */

document

    );


document
    .getElementById("loadMatchesBtn")

document
    .getElementById("loadTeamsBtn")

checkExistingSession();

</script>
