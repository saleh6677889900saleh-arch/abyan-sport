<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="لوحة تحكم أبيان سبورت"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>لوحة تحكم أبيان سبورت</title>


    <link rel="stylesheet" href="css/admin.css">

</head>


<body>


<div class="container">


    <!-- =========================================
         تسجيل الدخول
    ========================================== -->

    <div
        class="card"
        id="loginBox"
    >

        <h1>
            ⚽ أبيان سبورت
        </h1>

        <h2>
            تسجيل دخول المدير
        </h2>


        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            id="email"
            type="email"
            placeholder="البريد الإلكتروني"
            autocomplete="email"
        >


        <label for="password">
            كلمة المرور
        </label>

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >


        <button id="loginBtn">
            🔐 تسجيل الدخول
        </button>


        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>



    <!-- =========================================
         لوحة التحكم
    ========================================== -->

    <div
        class="card hidden"
        id="adminBox"
    >

        <h1>
            ⚽ لوحة تحكم أبيان سبورت
        </h1>


        <p
            id="userInfo"
            class="info"
        ></p>



        <!-- =====================================
             الأزرار الرئيسية
        ====================================== -->

        <div class="top-buttons">

            <button
                id="showTeamFormBtn"
                class="success"
            >
                ⚽ إضافة فريق
            </button>


            <button
                id="showMatchFormBtn"
            >
                ➕ إضافة مباراة
            </button>

        </div>


        <button
            id="loadAllBtn"
            class="secondary"
        >
            🔄 تحديث البيانات
        </button>



        <!-- =====================================
             نموذج إضافة فريق
        ====================================== -->

        <div
            id="teamForm"
            class="card hidden"
            style="margin-top:20px;"
        >

            <h2>
                ⚽ إضافة فريق جديد
            </h2>


            <label for="teamName">
                اسم الفريق *
            </label>

            <input
                id="teamName"
                type="text"
                placeholder="مثال: حسان أبين"
            >


            <label for="teamLogo">
                شعار الفريق
            </label>

            <input
                id="teamLogo"
                type="file"
                accept="image/png,image/jpeg,image/webp,image/gif"
            >


            <img
                id="logoPreview"
                class="preview"
                alt="معاينة الشعار"
            >


            <label for="teamCity">
                المدينة
            </label>

            <input
                id="teamCity"
                type="text"
                placeholder="مثال: أبين"
            >


            <label for="teamCoach">
                المدرب
            </label>

            <input
                id="teamCoach"
                type="text"
                placeholder="اسم المدرب"
            >


            <label for="teamYear">
                سنة التأسيس
            </label>

            <input
                id="teamYear"
                type="number"
                min="1800"
                max="2100"
                placeholder="مثال: 1990"
            >


            <label for="teamDescription">
                وصف الفريق
            </label>

            <textarea
                id="teamDescription"
                placeholder="اكتب نبذة عن الفريق..."
            ></textarea>


            <button
                id="addTeamBtn"
                class="success"
            >
                ✅ إضافة الفريق
            </button>


            <button
                id="cancelTeamBtn"
                class="secondary"
            >
                إلغاء
            </button>


            <div
                id="teamMessage"
                class="message"
            ></div>

        </div>



        <!-- =====================================
             نموذج إضافة مباراة
        ====================================== -->

        <div
            id="matchForm"
            class="card hidden"
            style="margin-top:20px;"
        >

            <h2>
                ➕ إضافة مباراة جديدة
            </h2>


            <div class="grid">

                <div>

                    <label for="homeTeam">
                        الفريق المضيف *
                    </label>

                    <select id="homeTeam">

                        <option value="">
                            اختر الفريق المضيف
                        </option>

                    </select>

                </div>


                <div>

                    <label for="awayTeam">
                        الفريق الضيف *
                    </label>

                    <select id="awayTeam">

                        <option value="">
                            اختر الفريق الضيف
                        </option>

                    </select>

                </div>

            </div>



            <div class="grid">

                <div>

                    <label for="matchDate">
                        تاريخ المباراة *
                    </label>

                    <input
                        id="matchDate"
                        type="date"
                    >

                </div>


                <div>

                    <label for="matchTime">
                        وقت المباراة *
                    </label>

                    <input
                        id="matchTime"
                        type="time"
                    >

                </div>

            </div>


            <label for="stadium">
                الملعب
            </label>

            <input
                id="stadium"
                type="text"
                placeholder="مثال: ملعب أبين"
            >


            <label for="matchStatus">
                حالة المباراة
            </label>

            <select id="matchStatus">

                <option value="قادمة">
                    قادمة
                </option>

                <option value="مباشرة">
                    مباشرة
                </option>

                <option value="انتهت">
                    انتهت
                </option>

            </select>


            <button
                id="addMatchBtn"
            >
                ✅ إضافة المباراة
            </button>


            <button
                id="cancelMatchBtn"
                class="secondary"
            >
                إلغاء
            </button>


            <div
                id="matchMessage"
                class="message"
            ></div>

        </div>




        <!-- =====================================
             اللاعبون
        ====================================== -->

        <div
            class="card"
            style="margin-top:20px;"
        >

            <div class="section-header">
                <div>
                    <h2>👤 اللاعبون</h2>
                    <p class="info">إدارة اللاعبين وربط كل لاعب بفريقه مع صورة وبياناته الأساسية.</p>
                </div>

                <button
                    id="showPlayerFormBtn"
                    class="success section-action"
                    type="button"
                >
                    ➕ إضافة لاعب
                </button>
            </div>


            <div
                id="playerForm"
                class="card hidden"
                style="margin-top:20px;"
            >

                <h3 id="playerFormTitle">👤 إضافة لاعب جديد</h3>

                <input id="playerId" type="hidden">

                <div class="grid">

                    <div>
                        <label for="playerName">اسم اللاعب *</label>
                        <input id="playerName" type="text" placeholder="مثال: محمد صالح">
                    </div>

                    <div>
                        <label for="playerTeam">الفريق *</label>
                        <select id="playerTeam">
                            <option value="">اختر الفريق</option>
                        </select>
                    </div>

                </div>

                <div class="grid">

                    <div>
                        <label for="playerNumber">رقم القميص</label>
                        <input id="playerNumber" type="number" min="0" max="99" placeholder="مثال: 10">
                    </div>

                    <div>
                        <label for="playerPosition">المركز</label>
                        <select id="playerPosition">
                            <option value="">اختر المركز</option>
                            <option value="حارس مرمى">حارس مرمى</option>
                            <option value="مدافع">مدافع</option>
                            <option value="ظهير أيمن">ظهير أيمن</option>
                            <option value="ظهير أيسر">ظهير أيسر</option>
                            <option value="وسط">وسط</option>
                            <option value="جناح أيمن">جناح أيمن</option>
                            <option value="جناح أيسر">جناح أيسر</option>
                            <option value="مهاجم">مهاجم</option>
                            <option value="مهاجم ثانٍ">مهاجم ثانٍ</option>
                        </select>
                    </div>

                </div>

                <label for="playerPhoto">صورة اللاعب</label>
                <input
                    id="playerPhoto"
                    type="file"
                    accept="image/png,image/jpeg,image/webp,image/gif"
                >

                <img
                    id="playerPhotoPreview"
                    class="preview player-photo-preview"
                    alt="معاينة صورة اللاعب"
                >

                <div class="grid">

                    <div>
                        <label for="playerBirthDate">تاريخ الميلاد</label>
                        <input id="playerBirthDate" type="date">
                    </div>

                    <div>
                        <label for="playerNationality">الجنسية</label>
                        <input id="playerNationality" type="text" placeholder="مثال: يمني">
                    </div>

                </div>

                <div class="grid">

                    <div>
                        <label for="playerHeight">الطول (سم)</label>
                        <input id="playerHeight" type="number" min="0" step="0.1" placeholder="مثال: 178">
                    </div>

                    <div>
                        <label for="playerWeight">الوزن (كجم)</label>
                        <input id="playerWeight" type="number" min="0" step="0.1" placeholder="مثال: 72">
                    </div>

                </div>

                <label for="playerFoot">القدم المفضلة</label>
                <select id="playerFoot">
                    <option value="">اختر القدم</option>
                    <option value="اليمنى">اليمنى</option>
                    <option value="اليسرى">اليسرى</option>
                    <option value="كلتاهما">كلتاهما</option>
                </select>

                <label for="playerBio">نبذة عن اللاعب</label>
                <textarea id="playerBio" placeholder="نبذة ومعلومات إضافية عن اللاعب..."></textarea>

                <label for="playerActive">حالة اللاعب</label>
                <select id="playerActive">
                    <option value="true">نشط</option>
                    <option value="false">غير نشط</option>
                </select>

                <button
                    id="savePlayerBtn"
                    class="success"
                    type="button"
                >
                    ✅ حفظ اللاعب
                </button>

                <button
                    id="cancelPlayerBtn"
                    class="secondary"
                    type="button"
                >
                    إلغاء
                </button>

                <div id="playerMessage" class="message"></div>

            </div>


            <div id="players">
                <div class="loading">جاري تحميل اللاعبين...</div>
            </div>

        </div>


        <!-- =====================================
             المباريات
        ====================================== -->

        <div
            class="card"
            style="margin-top:20px;"
        >

            <h2>
                🏆 المباريات
            </h2>


            <div id="matches">

                <div class="loading">
                    جاري تحميل المباريات...
                </div>

            </div>

        </div>



        <!-- =====================================
             الفرق
        ====================================== -->

        <div
            class="card"
            style="margin-top:20px;"
        >

            <h2>
                ⚽ الفرق
            </h2>


            <div id="teams">

                <div class="loading">
                    جاري تحميل الفرق...
                </div>

            </div>

        </div>



        <!-- تسجيل الخروج -->

        <button
            id="logoutBtn"
            class="danger logout"
        >
            🚪 تسجيل الخروج
        </button>

    </div>

</div>



<!-- =========================================
     Supabase
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/admin.js"></script>

</body>

</html>
