<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>لوحة تحكم أبيان سبورت</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        .container {
            width: min(1000px, 94%);
            margin: 25px auto;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        h1 {
            font-size: 26px;
        }

        h2 {
            font-size: 21px;
        }

        label {
            display: block;
            margin: 12px 0 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            font-size: 16px;
            background: #fff;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            border: 0;
            border-radius: 11px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        .secondary {
            background: #475569;
        }

        .success {
            background: #16a34a;
        }

        .danger {
            background: #dc2626;
        }

        .warning {
            background: #d97706;
        }

        .hidden {
            display: none !important;
        }

        .message {
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .error {
            color: #b91c1c;
            background: #fef2f2;
            border-color: #fecaca;
        }

        .ok {
            color: #166534;
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .match,
        .team {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            margin-top: 15px;
            background: #fff;
        }

        .score {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .team-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
        }

        .team-logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .preview {
            display: none;
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-top: 12px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
        }

        .top-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .info {
            color: #475569;
            line-height: 1.8;
        }

        .logout {
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .grid,
            .score,
            .top-buttons {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- تسجيل الدخول -->
    <div class="card" id="loginBox">

        <h1>⚽ أبيان سبورت</h1>

        <h2>تسجيل دخول المدير</h2>

        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            id="email"
            type="email"
            placeholder="البريد الإلكتروني"
        >

        <label for="password">
            كلمة المرور
        </label>

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
        >

        <button id="loginBtn">
            🔐 تسجيل الدخول
        </button>

        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>


    <!-- لوحة التحكم -->
    <div
        class="card hidden"
        id="adminBox"
    >

        <h1>⚽ لوحة تحكم أبيان سبورت</h1>

        <p
            id="userInfo"
            class="info"
        ></p>


        <!-- الأزرار الرئيسية -->
        <div class="top-buttons">

            <button
                id="showTeamFormBtn"
                class="success"
            >
                ⚽ إضافة فريق
            </button>

            <button
                id="showMatchFormBtn"
            >
                ➕ إضافة مباراة
            </button>

        </div>


        <button
            id="loadAllBtn"
            class="secondary"
        >
            🔄 تحديث البيانات
        </button>


        <!-- إضافة فريق -->
        <div
            id="teamForm"
            class="card hidden"
            style="margin-top:20px;"
        >

            <h2>⚽ إضافة فريق جديد</h2>

            <label for="teamName">
                اسم الفريق *
            </label>

            <input
                id="teamName"
                type="text"
                placeholder="مثال: حسان أبين"
            >


            <label for="teamLogo">
                شعار الفريق
            </label>

            <input
                id="teamLogo"
                type="file"
                accept="image/*"
            >

            <img
                id="logoPreview"
                class="preview"
                alt="معاينة الشعار"
            >


            <label for="teamCity">
                المدينة
            </label>

            <input
                id="teamCity"
                type="text"
                placeholder="مثال: أبين"
            >


            <label for="teamCoach">
                المدرب
            </label>

            <input
                id="teamCoach"
                type="text"
                placeholder="اسم المدرب"
            >


            <label for="teamYear">
                سنة التأسيس
            </label>

            <input
                id="teamYear"
                type="number"
                min="1800"
                max="2100"
                placeholder="مثال: 1990"
            >


            <label for="teamDescription">
                وصف الفريق
            </label>

            <textarea
                id="teamDescription"
                placeholder="اكتب نبذة عن الفريق..."
            ></textarea>


            <button
                id="addTeamBtn"
                class="success"
            >
                ✅ إضافة الفريق
            </button>

            <button
                id="cancelTeamBtn"
                class="secondary"
            >
                إلغاء
            </button>

            <div
                id="teamMessage"
                class="message"
            ></div>

        </div>


        <!-- إضافة مباراة -->
        <div
            id="matchForm"
            class="card hidden"
            style="margin-top:20px;"
        >

            <h2>➕ إضافة مباراة جديدة</h2>


            <div class="grid">

                <div>

                    <label for="homeTeam">
                        الفريق المضيف *
                    </label>

                    <select id="homeTeam">
                        <option value="">
                            اختر الفريق المضيف
                        </option>
                    </select>

                </div>


                <div>

                    <label for="awayTeam">
                        الفريق الضيف *
                    </label>

                    <select id="awayTeam">
                        <option value="">
                            اختر الفريق الضيف
                        </option>
                    </select>

                </div>

            </div>


            <div class="grid">

                <div>

                    <label for="matchDate">
                        تاريخ المباراة *
                    </label>

                    <input
                        id="matchDate"
                        type="date"
                    >

                </div>


                <div>

                    <label for="matchTime">
                        وقت المباراة *
                    </label>

                    <input
                        id="matchTime"
                        type="time"
                    >

                </div>

            </div>


            <label for="stadium">
                الملعب
            </label>

            <input
                id="stadium"
                type="text"
                placeholder="مثال: ملعب أبين"
            >


            <label for="matchStatus">
                حالة المباراة
            </label>

            <select id="matchStatus">

                <option value="قادمة">
                    قادمة
                </option>

                <option value="مباشرة">
                    مباشرة
                </option>

                <option value="انتهت">
                    انتهت
                </option>

            </select>


            <button
                id="addMatchBtn"
            >
                ✅ إضافة المباراة
            </button>

            <button
                id="cancelMatchBtn"
                class="secondary"
            >
                إلغاء
            </button>


            <div
                id="matchMessage"
                class="message"
            ></div>

        </div>


        <!-- قائمة المباريات -->
        <div
            class="card"
            style="margin-top:20px;"
        >

            <h2>🏆 المباريات</h2>

            <div id="matches">
                جاري التحميل...
            </div>

        </div>


        <!-- قائمة الفرق -->
        <div
            class="card"
            style="margin-top:20px;"
        >

            <h2>⚽ الفرق</h2>

            <div id="teams">
                جاري التحميل...
            </div>

        </div>


        <button
            id="logoutBtn"
            class="danger logout"
        >
            🚪 تسجيل الخروج
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ujbgrwgxhusgoobhoanx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_oE8HsCGOsmRvIg0XwzymMA_I_33XlZ6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginBox =
    document.getElementById("loginBox");

const adminBox =
    document.getElementById("adminBox");

const loginMessage =
    document.getElementById("loginMessage");

const userInfo =
    document.getElementById("userInfo");

const matchesContainer =
    document.getElementById("matches");

const teamsContainer =
    document.getElementById("teams");

const teamMessage =
    document.getElementById("teamMessage");

const matchMessage =
    document.getElementById("matchMessage");

const teamLogoInput =
    document.getElementById("teamLogo");

const logoPreview =
    document.getElementById("logoPreview");


let currentTeams = [];


/* =====================================================
   تسجيل الدخول
===================================================== */

async function login() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;


    if (!email || !password) {

        loginMessage.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور.";

        loginMessage.className =
            "message error";

        return;
    }


    loginMessage.textContent =
        "جاري تسجيل الدخول...";

    loginMessage.className =
        "message";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        loginMessage.textContent =
            "فشل تسجيل الدخول: " +
            error.message;

        loginMessage.className =
            "message error";

        return;
    }


    await checkAdmin(data.user);

}


/* =====================================================
   التحقق من المدير
===================================================== */

async function checkAdmin(user) {

    const { data, error } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();


    if (error) {

        loginMessage.textContent =
            "حدث خطأ أثناء التحقق من صلاحية المدير.";

        loginMessage.className =
            "message error";

        console.error(error);

        return;
    }


    if (!data) {

        loginMessage.textContent =
            "هذا الحساب ليس مديرًا.";

        loginMessage.className =
            "message error";

        await supabaseClient.auth.signOut();

        return;
    }


    loginBox.classList.add("hidden");

    adminBox.classList.remove("hidden");


    userInfo.textContent =
        "تم تسجيل الدخول كمدير: " +
        user.email;


    await loadAll();

}


/* =====================================================
   تحميل كل البيانات
===================================================== */

async function loadAll() {

    await loadTeams();

    await loadMatches();

}


/* =====================================================
   تحميل الفرق
===================================================== */

async function loadTeams() {

    teamsContainer.innerHTML =
        "جاري تحميل الفرق...";


    const { data, error } =
        await supabaseClient
            .from("teams")
            .select("*")
            .order("id", {
                ascending: false
            });


    if (error) {

        teamsContainer.innerHTML =
            `<div class="message error">
                فشل تحميل الفرق:
                ${escapeHtml(error.message)}
            </div>`;

        console.error(error);

        return;
    }


    currentTeams =
        data || [];


    updateTeamSelects();


    if (!data || data.length === 0) {

        teamsContainer.innerHTML =
            `<div class="message">
                لا توجد فرق حاليًا.
            </div>`;

        return;
    }


    teamsContainer.innerHTML = "";


    data.forEach(team => {

        const div =
            document.createElement("div");

        div.className =
            "team";


        const logo =
            team.logo_url
                ? `<img
                    src="${escapeAttribute(team.logo_url)}"
                    class="team-logo"
                    alt="شعار الفريق"
                   >`
                : `<div
                    class="team-logo"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:28px;
                    "
                   >
                    ⚽
                   </div>`;


        div.innerHTML = `

            <div class="team-header">

                ${logo}

                <div>

                    <h3>
                        ${escapeHtml(team.name)}
                    </h3>

                    <div class="info">

                        ${team.city
                            ? "📍 " +
                              escapeHtml(team.city)
                            : ""}

                        ${team.coach
                            ? "<br>👨‍🏫 المدرب: " +
                              escapeHtml(team.coach)
                            : ""}

                        ${team.founded_year
                            ? "<br>📅 تأسس: " +
                              escapeHtml(team.founded_year)
                            : ""}

                    </div>

                </div>

            </div>


            ${team.description
                ? `<p>
                    ${escapeHtml(team.description)}
                   </p>`
                : ""}


            <button
                class="danger"
                onclick="deleteTeam(${team.id})"
            >
                🗑️ حذف الفريق
            </button>

        `;


        teamsContainer.appendChild(div);

    });

}


/* =====================================================
   القوائم المنسدلة للفرق
===================================================== */

function updateTeamSelects() {

    const homeSelect =
        document.getElementById("homeTeam");

    const awaySelect =
        document.getElementById("awayTeam");


    homeSelect.innerHTML =
        `<option value="">
            اختر الفريق المضيف
         </option>`;


    awaySelect.innerHTML =
        `<option value="">
            اختر الفريق الضيف
         </option>`;


    currentTeams.forEach(team => {

        const option1 =
            document.createElement("option");

        option1.value =
            team.name;

        option1.textContent =
            team.name;


        const option2 =
            document.createElement("option");

        option2.value =
            team.name;

        option2.textContent =
            team.name;


        homeSelect.appendChild(option1);

        awaySelect.appendChild(option2);

    });

}


/* =====================================================
   معاينة الشعار
===================================================== */

teamLogoInput.addEventListener(
    "change",
    function () {

        const file =
            this.files[0];


        if (!file) {

            logoPreview.style.display =
                "none";

            return;
        }


        if (!file.type.startsWith("image/")) {

            teamMessage.textContent =
                "الملف المختار ليس صورة.";

            teamMessage.className =
                "message error";

            this.value = "";

            logoPreview.style.display =
                "none";

            return;
        }


        const maxSize =
            5 * 1024 * 1024;


        if (file.size > maxSize) {

            teamMessage.textContent =
                "حجم الصورة أكبر من 5 ميجابايت.";

            teamMessage.className =
                "message error";

            this.value = "";

            logoPreview.style.display =
                "none";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function (event) {

                logoPreview.src =
                    event.target.result;

                logoPreview.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* =====================================================
   إضافة فريق
===================================================== */

async function addTeam() {

    const name =
        document
            .getElementById("teamName")
            .value
            .trim();


    const city =
        document
            .getElementById("teamCity")
            .value
            .trim();


    const coach =
        document
            .getElementById("teamCoach")
            .value
            .trim();


    const foundedYear =
        document
            .getElementById("teamYear")
            .value;


    const description =
        document
            .getElementById("teamDescription")
            .value
            .trim();


    const file =
        teamLogoInput.files[0];


    if (!name) {

        teamMessage.textContent =
            "اكتب اسم الفريق.";

        teamMessage.className =
            "message error";

        return;
    }


    teamMessage.textContent =
        "جاري إضافة الفريق...";

    teamMessage.className =
        "message";


    let logoUrl = null;


    /* رفع الشعار */

    if (file) {

        if (!file.type.startsWith("image/")) {

            teamMessage.textContent =
                "الملف المختار ليس صورة.";

            teamMessage.className =
                "message error";

            return;
        }


        if (file.size > 5 * 1024 * 1024) {

            teamMessage.textContent =
                "حجم الصورة أكبر من 5 ميجابايت.";

            teamMessage.className =
                "message error";

            return;
        }


        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const safeName =
            name
                .replace(/[^\u0600-\u06FFa-zA-Z0-9]/g, "-")
                .replace(/-+/g, "-");


        const fileName =
            safeName +
            "-" +
            Date.now() +
            "." +
            extension;


        const filePath =
            fileName;


        const { error: uploadError } =
            await supabaseClient.storage
                .from("team-logos")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false,
                        contentType: file.type
                    }
                );


        if (uploadError) {

            console.error(uploadError);

            teamMessage.textContent =
                "فشل رفع الشعار: " +
                uploadError.message;

            teamMessage.className =
                "message error";

            return;
        }


        const { data: publicData } =
            supabaseClient.storage
                .from("team-logos")
                .getPublicUrl(filePath);


        logoUrl =
            publicData.publicUrl;

    }


    /* حفظ الفريق في الجدول */

    const insertData = {

        name: name,

        logo_url: logoUrl,

        city: city || null,

        coach: coach || null,

        founded_year:
            foundedYear
                ? Number(foundedYear)
                : null,

        description:
            description || null

    };


    const { error } =
        await supabaseClient
            .from("teams")
            .insert(insertData);


    if (error) {

        console.error(error);

        teamMessage.textContent =
            "فشل إضافة الفريق: " +
            error.message;

        teamMessage.className =
            "message error";

        return;
    }


    teamMessage.textContent =
        "✅ تمت إضافة الفريق بنجاح.";

    teamMessage.className =
        "message ok";


    document
        .getElementById("teamName")
        .value = "";

    document
        .getElementById("teamCity")
        .value = "";

    document
        .getElementById("teamCoach")
        .value = "";

    document
        .getElementById("teamYear")
        .value = "";

    document
        .getElementById("teamDescription")
        .value = "";

    teamLogoInput.value = "";

    logoPreview.src = "";

    logoPreview.style.display =
        "none";


    await loadTeams();

}


/* =====================================================
   حذف فريق
===================================================== */

async function deleteTeam(id) {

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذا الفريق؟"
        );


    if (!confirmed) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("teams")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "فشل حذف الفريق: " +
            error.message
        );

        console.error(error);

        return;
    }


    alert(
        "✅ تم حذف الفريق."
    );


    await loadTeams();

}


/* =====================================================
   إضافة مباراة
===================================================== */

async function addMatch() {

    const homeTeam =
        document
            .getElementById("homeTeam")
            .value;


    const awayTeam =
        document
            .getElementById("awayTeam")
            .value;


    const matchDate =
        document
            .getElementById("matchDate")
            .value;


    const matchTime =
        document
            .getElementById("matchTime")
            .value;


    const stadium =
        document
            .getElementById("stadium")
            .value
            .trim();


    const status =
        document
            .getElementById("matchStatus")
            .value;


    if (!homeTeam) {

        matchMessage.textContent =
            "اختر الفريق المضيف.";

        matchMessage.className =
            "message error";

        return;
    }


    if (!awayTeam) {

        matchMessage.textContent =
            "اختر الفريق الضيف.";

        matchMessage.className =
            "message error";

        return;
    }


    if (homeTeam === awayTeam) {

        matchMessage.textContent =
            "لا يمكن أن يكون الفريقان متطابقين.";

        matchMessage.className =
            "message error";

        return;
    }


    if (!matchDate) {

        matchMessage.textContent =
            "اختر تاريخ المباراة.";

        matchMessage.className =
            "message error";

        return;
    }


    if (!matchTime) {

        matchMessage.textContent =
            "اختر وقت المباراة.";

        matchMessage.className =
            "message error";

        return;
    }


    matchMessage.textContent =
        "جاري إضافة المباراة...";

    matchMessage.className =
        "message";


    const { error } =
        await supabaseClient
            .from("matches")
            .insert({

                home_team: homeTeam,

                away_team: awayTeam,

                match_date: matchDate,

                match_time: matchTime,

                stadium:
                    stadium || null,

                home_score: 0,

                away_score: 0,

                status: status

            });


    if (error) {

        console.error(error);

        matchMessage.textContent =
            "فشل إضافة المباراة: " +
            error.message;

        matchMessage.className =
            "message error";

        return;
    }


    matchMessage.textContent =
        "✅ تمت إضافة المباراة بنجاح.";

    matchMessage.className =
        "message ok";


    document
        .getElementById("homeTeam")
        .value = "";

    document
        .getElementById("awayTeam")
        .value = "";

    document
        .getElementById("matchDate")
        .value = "";

    document
        .getElementById("matchTime")
        .value = "";

    document
        .getElementById("stadium")
        .value = "";

    document
        .getElementById("matchStatus")
        .value =
            "قادمة";


    await loadMatches();

}


/* =====================================================
   تحميل المباريات
===================================================== */

async function loadMatches() {

    matchesContainer.innerHTML =
        "جاري تحميل المباريات...";


    const { data, error } =
        await supabaseClient
            .from("matches")
            .select("*")
            .order("match_date", {
                ascending: true
            });


    if (error) {

        matchesContainer.innerHTML =
            `<div class="message error">
                فشل تحميل المباريات:
                ${escapeHtml(error.message)}
            </div>`;

        console.error(error);

        return;
    }


    if (!data || data.length === 0) {

        matchesContainer.innerHTML =
            `<div class="message">
                لا توجد مباريات حاليًا.
            </div>`;

        return;
    }


    matchesContainer.innerHTML = "";


    data.forEach(match => {

        const div =
            document.createElement("div");

        div.className =
            "match";


        div.innerHTML = `

            <h3>
                ${escapeHtml(match.home_team)}
                🆚
                ${escapeHtml(match.away_team)}
            </h3>


            <div class="info">

                📅 التاريخ:
                ${escapeHtml(match.match_date || "")}

                <br>

                🕐 الوقت:
                ${escapeHtml(match.match_time || "")}

                <br>

                🏟️ الملعب:
                ${escapeHtml(match.stadium || "غير محدد")}

                <br>

                📌 الحالة:
                ${escapeHtml(match.status || "غير محدد")}

            </div>


            <div class="score">

                <div>

                    <label>
                        نتيجة ${escapeHtml(match.home_team)}
                    </label>

                    <input
                        type="number"
                        min="0"
                        id="home-${match.id}"
                        value="${match.home_score ?? 0}"
                    >

                </div>


                <div>

                    <label>
                        نتيجة ${escapeHtml(match.away_team)}
                    </label>

                    <input
                        type="number"
                        min="0"
                        id="away-${match.id}"
                        value="${match.away_score ?? 0}"
                    >

                </div>

            </div>


            <button
                class="success"
                onclick="updateScore(${match.id})"
            >
                💾 حفظ النتيجة
            </button>


            <button
                class="danger"
                onclick="deleteMatch(${match.id})"
            >
                🗑️ حذف المباراة
            </button>


            <div
                id="message-${match.id}"
                class="message"
            ></div>

        `;


        matchesContainer.appendChild(div);

    });

}


/* =====================================================
   تحديث النتيجة
===================================================== */

async function updateScore(matchId) {

    const homeInput =
        document.getElementById(
            "home-" + matchId
        );


    const awayInput =
        document.getElementById(
            "away-" + matchId
        );


    const message =
        document.getElementById(
            "message-" + matchId
        );


    const homeScore =
        Number(homeInput.value);


    const awayScore =
        Number(awayInput.value);


    if (
        !Number.isInteger(homeScore) ||
        homeScore < 0 ||
        !Number.isInteger(awayScore) ||
        awayScore < 0
    ) {

        message.textContent =
            "النتيجة غير صحيحة.";

        message.className =
            "message error";

        return;
    }


    message.textContent =
        "جاري الحفظ...";

    message.className =
        "message";


    const { error } =
        await supabaseClient
            .from("matches")
            .update({

                home_score: homeScore,

                away_score: awayScore,

                status: "انتهت"

            })
            .eq("id", matchId);


    if (error) {

        message.textContent =
            "فشل الحفظ: " +
            error.message;

        message.className =
            "message error";

        console.error(error);

        return;
    }


    message.textContent =
        "✅ تم حفظ النتيجة بنجاح.";

    message.className =
        "message ok";


    await loadMatches();

}


/* =====================================================
   حذف مباراة
===================================================== */

async function deleteMatch(id) {

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذه المباراة؟"
        );


    if (!confirmed) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("matches")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "فشل حذف المباراة: " +
            error.message
        );

        console.error(error);

        return;
    }


    alert(
        "✅ تم حذف المباراة."
    );


    await loadMatches();

}

   تسجيل الخروج

async function logout() {

    await supabaseClient.auth.signOut();


    adminBox.classList.add("hidden");

    loginBox.classList.remove("hidden");


    loginMessage.textContent =
        "تم تسجيل الخروج.";

    loginMessage.className =
        "message ok";

}


/* =====================================================
   أدوات الحماية
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");

}
