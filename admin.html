<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="لوحة تحكم أبيان سبورت"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>لوحة تحكم أبيان سبورت</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family:
                Arial,
                "Tajawal",
                sans-serif;

            background: #f1f5f9;
            color: #0f172a;
        }


        .container {
            width: min(1000px, 94%);
            margin: 25px auto;
        }


        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }


        h1,
        h2,
        h3 {
            margin-top: 0;
        }


        h1 {
            font-size: 26px;
        }


        h2 {
            font-size: 21px;
        }


        h3 {
            font-size: 19px;
        }


        label {
            display: block;
            margin: 12px 0 7px;
            font-weight: bold;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 13px;

            border:
                1px solid
                #cbd5e1;

            border-radius: 11px;

            font-size: 16px;

            background: #ffffff;
        }


        textarea {
            min-height: 100px;
            resize: vertical;
        }


        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color:
                #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.1);
        }


        button {

            width: 100%;

            margin-top: 14px;

            padding: 14px;

            border: 0;

            border-radius: 11px;

            background: #2563eb;

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            opacity: 0.92;
        }


        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        .secondary {
            background: #475569;
        }


        .success {
            background: #16a34a;
        }


        .danger {
            background: #dc2626;
        }


        .warning {
            background: #d97706;
        }


        .hidden {
            display: none !important;
        }


        .message {

            margin-top: 14px;

            padding: 12px;

            border-radius: 10px;

            background: #f8fafc;

            border:
                1px solid
                #e2e8f0;

            line-height: 1.7;
        }


        .error {

            color: #b91c1c;

            background: #fef2f2;

            border-color:
                #fecaca;
        }


        .ok {

            color: #166534;

            background: #f0fdf4;

            border-color:
                #bbf7d0;
        }


        .grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;
        }


        .match,
        .team {

            border:
                1px solid
                #e2e8f0;

            border-radius: 16px;

            padding: 18px;

            margin-top: 15px;

            background: #ffffff;
        }


        .score {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }


        .team-header {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 10px;
        }


        .team-logo {

            width: 65px;
            height: 65px;

            object-fit: contain;

            border-radius: 12px;

            border:
                1px solid
                #e2e8f0;

            background: #f8fafc;
        }


        .preview {

            display: none;

            width: 120px;
            height: 120px;

            object-fit: contain;

            margin-top: 12px;

            border-radius: 12px;

            border:
                1px solid
                #cbd5e1;

            background: #f8fafc;
        }


        .top-buttons {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-top: 15px;
        }


        .info {

            color: #475569;

            line-height: 1.8;
        }


        .logout {
            margin-top: 20px;
        }


        .loading {
            text-align: center;
            padding: 20px;
            color: #475569;
        }


        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
            background: #f8fafc;
            border-radius: 12px;
        }


        .logo-box {

            width: 65px;
            height: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            border-radius: 12px;

            border:
                1px solid
                #e2e8f0;

            background: #f8fafc;
        }


        .divider {

            height: 1px;

            background:
                #e2e8f0;

            margin:
                20px 0;
        }


        @media (max-width: 700px) {

            .grid,
            .score,
            .top-buttons {

                grid-template-columns:
                    1fr;
            }


            .container {

                width: 94%;
            }


            .card {

                padding: 17px;
            }


            h1 {

                font-size: 23px;
            }

        }

    </style>

</head>

<!-- =========================================
     Supabase
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================================
   إعداد Supabase
========================================================= */

const SUPABASE_URL =
    "https://ujbgrwgxhusgoobhoanx.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_oE8HsCGOsmRvIg0XwzymMA_I_33XlZ6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================================
   العناصر
========================================================= */

const loginBox =
    document.getElementById("loginBox");


const adminBox =
    document.getElementById("adminBox");


const loginMessage =
    document.getElementById("loginMessage");


const userInfo =
    document.getElementById("userInfo");


const matchesContainer =
    document.getElementById("matches");


const teamsContainer =
    document.getElementById("teams");


const teamMessage =
    document.getElementById("teamMessage");


const matchMessage =
    document.getElementById("matchMessage");


const teamLogoInput =
    document.getElementById("teamLogo");


const logoPreview =
    document.getElementById("logoPreview");



let currentTeams = [];



/* =========================================================
   تسجيل الدخول
========================================================= */

async function login() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    if (!email || !password) {

        loginMessage.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور.";


        loginMessage.className =
            "message error";


        return;
    }


    loginMessage.textContent =
        "جاري تسجيل الدخول...";


    loginMessage.className =
        "message";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        loginMessage.textContent =
            "فشل تسجيل الدخول: " +
            error.message;


        loginMessage.className =
            "message error";


        console.error(error);


        return;
    }


    await checkAdmin(data.user);

}



/* =========================================================
   التحقق من المدير
========================================================= */

async function checkAdmin(user) {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();


    if (error) {

        loginMessage.textContent =
            "حدث خطأ أثناء التحقق من صلاحية المدير: " +
            error.message;


        loginMessage.className =
            "message error";


        console.error(error);


        return;
    }


    if (!data) {

        loginMessage.textContent =
            "هذا الحساب ليس مديرًا.";


        loginMessage.className =
            "message error";


        await supabaseClient.auth.signOut();


        return;
    }


    loginBox.classList.add("hidden");


    adminBox.classList.remove("hidden");


    userInfo.textContent =
        "تم تسجيل الدخول كمدير: " +
        user.email;


    await loadAll();

}



/* =========================================================
   تحميل جميع البيانات
========================================================= */

async function loadAll() {

    await loadTeams();

    await loadMatches();

}



/* =========================================================
   تحميل الفرق
========================================================= */

async function loadTeams() {

    teamsContainer.innerHTML =
        `
        <div class="loading">
            جاري تحميل الفرق...
        </div>
        `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("teams")
            .select("*")
            .order("id", {
                ascending: false
            });


    if (error) {

        teamsContainer.innerHTML =
            `
            <div class="message error">
                ❌ فشل تحميل الفرق:
                <br>
                ${escapeHtml(error.message)}
            </div>
            `;


        console.error(error);


        return;
    }


    currentTeams =
        data || [];


    updateTeamSelects();


    if (!data || data.length === 0) {

        teamsContainer.innerHTML =
            `
            <div class="empty">
                لا توجد فرق حاليًا.
            </div>
            `;


        return;
    }


    teamsContainer.innerHTML = "";


    data.forEach(team => {

        const div =
            document.createElement("div");


        div.className =
            "team";


        let logoHtml;


        if (team.logo_url) {

            logoHtml =
                `
                <img
                    src="${escapeAttribute(team.logo_url)}"
                    class="team-logo"
                    alt="شعار ${escapeAttribute(team.name)}"
                >
                `;

        } else {

            logoHtml =
                `
                <div class="logo-box">
                    ⚽
                </div>
                `;

        }


        div.innerHTML =

            `
            <div class="team-header">

                ${logoHtml}

                <div>

                    <h3>
                        ${escapeHtml(team.name)}
                    </h3>

                    <div class="info">

                        ${
                            team.city
                                ? "📍 " +
                                  escapeHtml(team.city)
                                : ""
                        }

                        ${
                            team.coach
                                ? "<br>👨‍🏫 المدرب: " +
                                  escapeHtml(team.coach)
                                : ""
                        }

                        ${
                            team.founded_year
                                ? "<br>📅 تأسس: " +
                                  escapeHtml(
                                      team.founded_year
                                  )
                                : ""
                        }

                    </div>

                </div>

            </div>


            ${
                team.description
                    ? `
                    <p class="info">
                        ${escapeHtml(
                            team.description
                        )}
                    </p>
                    `
                    : ""
            }


            <button
                class="danger"
                onclick="deleteTeam(${team.id})"
            >
                🗑️ حذف الفريق
            </button>

            `;


        teamsContainer.appendChild(div);

    });

}



/* =========================================================
   تحديث قوائم الفرق
========================================================= */

function updateTeamSelects() {

    const homeSelect =
        document.getElementById("homeTeam");


    const awaySelect =
        document.getElementById("awayTeam");


    homeSelect.innerHTML =
        `
        <option value="">
            اختر الفريق المضيف
        </option>
        `;


    awaySelect.innerHTML =
        `
        <option value="">
            اختر الفريق الضيف
        </option>
        `;


    currentTeams.forEach(team => {

        const optionHome =
            document.createElement("option");


        optionHome.value =
            team.name;


        optionHome.textContent =
            team.name;


        homeSelect.appendChild(
            optionHome
        );


        const optionAway =
            document.createElement("option");


        optionAway.value =
            team.name;


        optionAway.textContent =
            team.name;


        awaySelect.appendChild(
            optionAway
        );

    });

}



/* =========================================================
   معاينة الشعار
========================================================= */

teamLogoInput.addEventListener(
    "change",
    function () {

        const file =
            this.files[0];


        if (!file) {

            logoPreview.style.display =
                "none";


            logoPreview.removeAttribute(
                "src"
            );


            return;
        }


        if (!file.type.startsWith("image/")) {

            teamMessage.textContent =
                "❌ الملف المختار ليس صورة.";


            teamMessage.className =
                "message error";


            this.value = "";


            logoPreview.style.display =
                "none";


            return;
        }


        const maxSize =
            5 * 1024 * 1024;


        if (file.size > maxSize) {

            teamMessage.textContent =
                "❌ حجم الصورة أكبر من 5 ميجابايت.";


            teamMessage.className =
                "message error";


            this.value = "";


            logoPreview.style.display =
                "none";


            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                logoPreview.src =
                    event.target.result;


                logoPreview.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);



/* =========================================================
   إنشاء اسم ملف آمن
========================================================= */

function createSafeFileName(file) {

    let extension =
        "jpg";


    if (
        file &&
        file.name &&
        file.name.includes(".")
    ) {

        extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

    }


    const allowedExtensions = [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "gif"
    ];


    if (
        !allowedExtensions.includes(
            extension
        )
    ) {

        extension =
            "jpg";

    }


    /*
       مهم جدًا:

       لا نستخدم اسم الصورة الأصلي.

       حتى لو كانت الصورة اسمها:
       النجم.jpg

       سيتم رفعها باسم مثل:
       team-logo-xxxxxxxx.jpg

       وبالتالي نتجنب:
       Invalid key
    */


    const randomId =
        crypto.randomUUID()
            .replace(/-/g, "");


    const fileName =
        "team-logo-" +
        randomId +
        "." +
        extension;


    /*
       نضع الصور داخل مجلد teams
    */

    return "teams/" + fileName;

}



/* =========================================================
   إضافة فريق
========================================================= */

async function addTeam() {

    const button =
        document.getElementById(
            "addTeamBtn"
        );


    const name =
        document
            .getElementById("teamName")
            .value
            .trim();


    const city =
        document
            .getElementById("teamCity")
            .value
            .trim();


    const coach =
        document
            .getElementById("teamCoach")
            .value
            .trim();


    const foundedYear =
        document
            .getElementById("teamYear")
            .value;


    const description =
        document
            .getElementById("teamDescription")
            .value
            .trim();


    const file =
        teamLogoInput.files[0];


    if (!name) {

        teamMessage.textContent =
            "❌ اكتب اسم الفريق.";


        teamMessage.className =
            "message error";


        return;
    }


    if (foundedYear) {

        const year =
            Number(foundedYear);


        if (
            !Number.isInteger(year) ||
            year < 1800 ||
            year > 2100
        ) {

            teamMessage.textContent =
                "❌ سنة التأسيس غير صحيحة.";


            teamMessage.className =
                "message error";


            return;
        }

    }


    if (file) {

        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            teamMessage.textContent =
                "❌ الملف المختار ليس صورة.";


            teamMessage.className =
                "message error";


            return;
        }


        if (
            file.size >
            5 * 1024 * 1024
        ) {

            teamMessage.textContent =
                "❌ حجم الصورة أكبر من 5 ميجابايت.";


            teamMessage.className =
                "message error";


            return;
        }

    }


    button.disabled = true;


    teamMessage.textContent =
        "⏳ جاري إضافة الفريق...";


    teamMessage.className =
        "message";


    let logoUrl = null;

    let uploadedFilePath = null;



    /* =========================================
       رفع الشعار
    ========================================== */

    if (file) {

        /*
           اسم آمن بالكامل
        */

        const filePath =
            createSafeFileName(file);


        uploadedFilePath =
            filePath;


        teamMessage.textContent =
            "⏳ جاري رفع شعار الفريق...";


        const {
            error: uploadError
        } =
            await supabaseClient.storage
                .from("team-logos")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:
                            "3600",

                        upsert:
                            false,

                        contentType:
                            file.type
                    }
                );


        if (uploadError) {

            console.error(
                "Storage upload error:",
                uploadError
            );


            teamMessage.textContent =
                "❌ فشل رفع الشعار: " +
                uploadError.message;


            teamMessage.className =
                "message error";


            button.disabled = false;


            return;
        }


        /*
           الحصول على الرابط العام
        */

        const {
            data: publicData
        } =
            supabaseClient.storage
                .from("team-logos")
                .getPublicUrl(
                    filePath
                );


        if (
            !publicData ||
            !publicData.publicUrl
        ) {

            teamMessage.textContent =
                "❌ تم رفع الصورة لكن تعذر الحصول على رابطها.";


            teamMessage.className =
                "message error";


            button.disabled = false;


            return;
        }


        logoUrl =
            publicData.publicUrl;

    }



    /* =========================================
       إدخال الفريق في جدول teams
    ========================================== */

    const insertData = {

        name:
            name,

        logo_url:
            logoUrl,

        city:
            city || null,

        coach:
            coach || null,

        founded_year:
            foundedYear
                ? Number(foundedYear)
                : null,

        description:
            description || null

    };


    const {
        error: insertError
    } =
        await supabaseClient
            .from("teams")
            .insert(
                insertData
            );


    if (insertError) {

        console.error(
            "Teams insert error:",
            insertError
        );


        /*
           إذا تم رفع الصورة لكن فشل
           إدخال الفريق، نحاول حذف
           الصورة حتى لا تبقى ملفات
           غير مستخدمة.
        */

        if (uploadedFilePath) {

            await supabaseClient
                .storage
                .from("team-logos")
                .remove([
                    uploadedFilePath
                ]);

        }


        teamMessage.textContent =
            "❌ فشل إضافة الفريق: " +
            insertError.message;


        teamMessage.className =
            "message error";


        button.disabled = false;


        return;
    }



    /* =========================================
       نجاح
    ========================================== */

    teamMessage.textContent =
        "✅ تمت إضافة الفريق بنجاح.";


    teamMessage.className =
        "message ok";


    /*
       تنظيف النموذج
    */

    document
        .getElementById("teamName")
        .value = "";


    document
        .getElementById("teamCity")
        .value = "";


    document
        .getElementById("teamCoach")
        .value = "";


    document
        .getElementById("teamYear")
        .value = "";


    document
        .getElementById(
            "teamDescription"
        )
        .value = "";


    teamLogoInput.value = "";


    logoPreview.removeAttribute(
        "src"
    );


    logoPreview.style.display =
        "none";


    button.disabled = false;


    await loadTeams();

}

/* =========================================================

async function addMatch() {

    const button =
        document.getElementById(
            "addMatchBtn"
        );


    const homeTeam =
        document
            .getElementById("homeTeam")
            .value;


    const awayTeam =
        document
            .getElementById("awayTeam")
            .value;


    const matchDate =
        document
            .getElementById("matchDate")
            .value;


    const matchTime =
        document
            .getElementById("matchTime")
            .value;


    const stadium =
        document
            .getElementById("stadium")
            .value
            .trim();


    const status =
        document
            .getElementById("matchStatus")
            .value;


    if (!homeTeam) {

        matchMessage.textContent =
            "❌ اختر الفريق المضيف.";


        matchMessage.className =
            "message error";


        return;
    }


    if (!awayTeam) {

        matchMessage.textContent =
            "❌ اختر الفريق الضيف.";


        matchMessage.className =
            "message error";


        return;
    }


    if (
        homeTeam === awayTeam
    ) {

        matchMessage.textContent =
            "❌ لا يمكن أن يكون الفريقان متطابقين.";


        matchMessage.className =
            "message error";


        return;
    }


    if (!matchDate) {

        matchMessage.textContent =
            "❌ اختر تاريخ المباراة.";


        matchMessage.className =
            "message error";


        return;
    }


    if (!matchTime) {

        matchMessage.textContent =
            "❌ اختر وقت المباراة.";


        matchMessage.className =
            "message error";


        return;
    }


    button.disabled = true;


    matchMessage.textContent =
        "⏳ جاري إضافة المباراة...";


    matchMessage.className =
        "message";


    const {
        error
    } =
        await supabaseClient
            .from("matches")
            .insert({

                home_team:
                    homeTeam,

                away_team:
                    awayTeam,

                match_date:
                    matchDate,

                match_time:
                    matchTime,

                stadium:
                    stadium || null,

                home_score:
                    0,

                away_score:
                    0,

                status:
                    status

            });


    if (error) {

        console.error(error);


        matchMessage.textContent =
            "❌ فشل إضافة المباراة: " +
            error.message;


        matchMessage.className =
            "message error";


        button.disabled = false;


        return;
    }


    matchMessage.textContent =
        "✅ تمت إضافة المباراة بنجاح.";


    matchMessage.className =
        "message ok";


    document
        .getElementById("homeTeam")
        .value = "";


    document
        .getElementById("awayTeam")
        .value = "";


    document
        .getElementById("matchDate")
        .value = "";


    document
        .getElementById("matchTime")
        .value = "";


    document
        .getElementById("stadium")
        .value = "";


    document
        .getElementById("matchStatus")
        .value =
            "قادمة";


    button.disabled = false;


    await loadMatches();

}



/* =========================================================
   تحميل المباريات
========================================================= */

async function loadMatches() {

    matchesContainer.innerHTML =
        `
        <div class="loading">
            جاري تحميل المباريات...
        </div>
        `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("matches")
            .select("*")
            .order(
                "match_date",
                {
                    ascending: true
                }
            );


    if (error) {

        matchesContainer.innerHTML =
            `
            <div class="message error">

                ❌ فشل تحميل المباريات:

                <br>

                ${escapeHtml(
                    error.message
                )}

            </div>
            `;


        console.error(error);


        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        matchesContainer.innerHTML =
            `
            <div class="empty">
                لا توجد مباريات حاليًا.
            </div>
            `;


        return;
    }


    matchesContainer.innerHTML = "";


    data.forEach(match => {

        const div =
            document.createElement("div");


        div.className =
            "match";


        div.innerHTML =

            `
            <h3>

                ${escapeHtml(
                    match.home_team
                )}

                🆚

                ${escapeHtml(
                    match.away_team
                )}

            </h3>


            <div class="info">

                📅 التاريخ:
                ${escapeHtml(
                    match.match_date || ""
                )}

                <br>


                🕐 الوقت:
                ${escapeHtml(
                    match.match_time || ""
                )}

                <br>


                🏟️ الملعب:
                ${escapeHtml(
                    match.stadium ||
                    "غير محدد"
                )}

                <br>


                📌 الحالة:
                ${escapeHtml(
                    match.status ||
                    "غير محدد"
                )}

            </div>


            <div class="divider"></div>


            <div class="score">


                <div>

                    <label>

                        نتيجة
                        ${escapeHtml(
                            match.home_team
                        )}

                    </label>


                    <input
                        type="number"
                        min="0"
                        step="1"
                        id="home-${match.id}"
                        value="${Number.isInteger(match.home_score) ? match.home_score : 0}"
                    >

                </div>



                <div>

                    <label>

                        نتيجة
                        ${escapeHtml(
                            match.away_team
                        )}

                    </label>


                    <input
                        type="number"
                        min="0"
                        step="1"
                        id="away-${match.id}"
                        value="${Number.isInteger(match.away_score) ? match.away_score : 0}"
                    >

                </div>


            </div>


            <button
                class="success"
                onclick="updateScore(${match.id})"
            >
                💾 حفظ النتيجة
            </button>


            <button
                class="danger"
                onclick="deleteMatch(${match.id})"
            >
                🗑️ حذف المباراة
            </button>


            <div
                id="message-${match.id}"
                class="message"
            ></div>

            `;


        matchesContainer.appendChild(
            div
        );

    });

}



/* =========================================================
   تحديث نتيجة المباراة
========================================================= */

async function updateScore(matchId) {

    const homeInput =
        document.getElementById(
            "home-" + matchId
        );


    const awayInput =
        document.getElementById(
            "away-" + matchId
        );


    const message =
        document.getElementById(
            "message-" + matchId
        );


    if (
        !homeInput ||
        !awayInput ||
        !message
    ) {

        return;
    }


    const homeScore =
        Number(
            homeInput.value
        );


    const awayScore =
        Number(
            awayInput.value
        );


    if (
        !Number.isInteger(
            homeScore
        ) ||
        homeScore < 0 ||
        !Number.isInteger(
            awayScore
        ) ||
        awayScore < 0
    ) {

        message.textContent =
            "❌ النتيجة غير صحيحة.";


        message.className =
            "message error";


        return;
    }


    message.textContent =
        "⏳ جاري حفظ النتيجة...";


    message.className =
        "message";


    const {
        error
    } =
        await supabaseClient
            .from("matches")
            .update({

                home_score:
                    homeScore,

                away_score:
                    awayScore,

                status:
                    "انتهت"

            })
            .eq(
                "id",
                matchId
            );


    if (error) {

        message.textContent =
            "❌ فشل الحفظ: " +
            error.message;


        message.className =
            "message error";


        console.error(error);


        return;
    }


    message.textContent =
        "✅ تم حفظ النتيجة بنجاح.";


    message.className =
        "message ok";


    await loadMatches();

}

/* =========================================================
   حماية النصوص
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =========================================================
   حماية خصائص HTML
========================================================= */

function escapeAttribute(value) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        );

}

async function checkSession() {

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(
            "Session error:",
            error
        );


        return;
    }


    if (
        data &&
        data.session
    ) {

        await checkAdmin(
            data.session.user
        );

    }

}



/* =========================================================
   تشغيل التحقق
========================================================= */

/* =========================================================
   مراقبة تسجيل الدخول والخروج
========================================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        async function(
            event,
            session
        ) {

            if (
                event ===
                "SIGNED_OUT"
            ) {

                adminBox
                    .classList
                    .add("hidden");


                loginBox
                    .classList
                    .remove("hidden");


                return;
            }


            if (
                event ===
                "SIGNED_IN" &&
                session
            ) {

                await checkAdmin(
                    session.user
                );

            }

        }
    );
