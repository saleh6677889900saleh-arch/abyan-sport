<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>لوحة تحكم أبيان سبورت</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .container {
            width: min(1100px, 94%);
            margin: 25px auto;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, .08);
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        h1 {
            font-size: 28px;
        }

        h2 {
            font-size: 21px;
        }

        label {
            display: block;
            margin: 12px 0 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 11px;
            background: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 14px;
            border: 0;
            border-radius: 11px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .hidden {
            display: none !important;
        }

        .message {
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            background: #f3f4f6;
            line-height: 1.7;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
        }

        .top-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .add-button {
            background: #16a34a;
        }

        .refresh-button {
            background: #2563eb;
        }

        .logout {
            background: #dc2626;
        }

        .cancel {
            background: #6b7280;
        }

        .delete {
            background: #dc2626;
        }

        .edit {
            background: #f59e0b;
        }

        .save {
            background: #16a34a;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .match {
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 18px;
            margin-top: 16px;
            background: #fff;
        }

        .match-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .teams {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .team {
            font-weight: bold;
        }

        .vs {
            font-size: 20px;
        }

        .match-info {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #f8fafc;
            line-height: 2;
        }

        .score {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .score-actions {
            margin-top: 10px;
        }

        .team-form {
            border: 1px solid #e5e7eb;
            padding: 18px;
            border-radius: 15px;
            margin-top: 15px;
        }

        .logo-preview {
            display: none;
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid #e5e7eb;
            margin: 12px auto;
        }

        .team-list {
            margin-top: 20px;
        }

        .team-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-top: 10px;
        }

        .team-item img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            border-radius: 50%;
            border: 1px solid #e5e7eb;
        }

        .team-item-name {
            font-weight: bold;
            flex: 1;
        }

        .small {
            font-size: 13px;
            color: #6b7280;
        }

        @media (max-width: 700px) {

            .grid,
            .score,
            .top-buttons,
            .actions {
                grid-template-columns: 1fr;
            }

            .teams {
                grid-template-columns: 1fr;
            }

            .vs {
                margin: 5px 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         تسجيل الدخول
    ========================== -->

    <div class="card" id="loginBox">

        <h1>⚽ أبيان سبورت</h1>

        <h2>تسجيل دخول المدير</h2>

        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            id="email"
            type="email"
            placeholder="البريد الإلكتروني"
        >

        <label for="password">
            كلمة المرور
        </label>

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
        >

        <button id="loginBtn">
            تسجيل الدخول
        </button>

        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>


    <!-- =========================
         لوحة التحكم
    ========================== -->

    <div
        class="card hidden"
        id="adminBox"
    >

        <h1>⚽ لوحة تحكم أبيان سبورت</h1>

        <p id="userInfo"></p>

        <div class="top-buttons">

            <button
                id="showAddMatchBtn"
                class="add-button"
            >
                ➕ إضافة مباراة
            </button>

            <button
                id="showTeamBtn"
                class="refresh-button"
            >
                ⚽ إدارة الفرق
            </button>

        </div>

        <button
            id="loadMatchesBtn"
            class="refresh-button"
        >
            🔄 تحميل المباريات
        </button>

    </div>


    <!-- =========================
         إضافة مباراة
    ========================== -->

    <div
        class="card hidden"
        id="addMatchBox"
    >

        <h2>➕ إضافة مباراة جديدة</h2>

        <div class="grid">

            <div>
                <label for="homeTeam">
                    الفريق المضيف
                </label>

                <input
                    id="homeTeam"
                    type="text"
                    placeholder="مثال: حسان أبين"
                >
            </div>

            <div>
                <label for="awayTeam">
                    الفريق الضيف
                </label>

                <input
                    id="awayTeam"
                    type="text"
                    placeholder="مثال: شباب أبين"
                >
            </div>

        </div>

        <div class="grid">

            <div>
                <label for="matchDate">
                    تاريخ المباراة
                </label>

                <input
                    id="matchDate"
                    type="date"
                >
            </div>

            <div>
                <label for="matchTime">
                    وقت المباراة
                </label>

                <input
                    id="matchTime"
                    type="time"
                >
            </div>

        </div>

        <label for="stadium">
            🏟️ الملعب
        </label>

        <input
            id="stadium"
            type="text"
            placeholder="مثال: ملعب أبين"
        >

        <label for="matchStatus">
            حالة المباراة
        </label>

        <select id="matchStatus">

            <option value="قادمة">
                قادمة
            </option>

            <option value="مباشرة">
                مباشرة
            </option>

            <option value="انتهت">
                انتهت
            </option>

        </select>

        <div class="actions">

            <button
                id="addMatchBtn"
                class="save"
            >
                💾 حفظ المباراة
            </button>

            <button
                id="cancelMatchBtn"
                class="cancel"
            >
                إلغاء
            </button>

        </div>

        <div
            id="addMatchMessage"
            class="message"
        ></div>

    </div>


    <!-- =========================
         إدارة الفرق
    ========================== -->

    <div
        class="card hidden"
        id="teamsBox"
    >

        <h2>⚽ إدارة الفرق</h2>

        <div class="team-form">

            <h3>➕ إضافة فريق</h3>

            <label for="teamName">
                اسم الفريق
            </label>

            <input
                id="teamName"
                type="text"
                placeholder="مثال: حسان أبين"
            >

            <label for="teamLogo">
                🖼️ شعار الفريق
            </label>

            <input
                id="teamLogo"
                type="file"
                accept="image/png,image/jpeg,image/webp"
            >

            <img
                id="logoPreview"
                class="logo-preview"
                alt="معاينة الشعار"
            >

            <button
                id="addTeamBtn"
                class="save"
            >
                💾 إضافة الفريق
            </button>

            <div
                id="teamMessage"
                class="message"
            ></div>

        </div>

        <div class="team-list">

            <h3>
                الفرق الموجودة
            </h3>

            <div id="teamsList">
                جاري تحميل الفرق...
            </div>

        </div>

    </div>


    <!-- =========================
         المباريات
    ========================== -->

    <div
        class="card hidden"
        id="matchesBox"
    >

        <h2>🏆 المباريات</h2>

        <div id="matches">
            جاري تحميل المباريات...
        </div>

    </div>


    <!-- =========================
         تسجيل الخروج
    ========================== -->

    <div
        class="card hidden"
        id="logoutBox"
    >

        <button
            id="logoutBtn"
            class="logout"
        >
            🚪 تسجيل الخروج
        </button>

    </div>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   إعداد Supabase
========================================================= */

const SUPABASE_URL =
    "https://ujbgrwgxhusgoobhoanx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_oE8HsCGOsmRvIg0XwzymMA_I_33XlZ6";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   العناصر
========================================================= */

const loginBox =
    document.getElementById("loginBox");

const adminBox =
    document.getElementById("adminBox");

const addMatchBox =
    document.getElementById("addMatchBox");

const teamsBox =
    document.getElementById("teamsBox");

const matchesBox =
    document.getElementById("matchesBox");

const logoutBox =
    document.getElementById("logoutBox");

const loginMessage =
    document.getElementById("loginMessage");

const userInfo =
    document.getElementById("userInfo");

const matchesContainer =
    document.getElementById("matches");

const teamsList =
    document.getElementById("teamsList");


/* =========================================================
   تسجيل الدخول
========================================================= */

async function login() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    if (!email || !password) {

        showMessage(
            loginMessage,
            "اكتب البريد الإلكتروني وكلمة المرور.",
            "error"
        );

        return;
    }

    showMessage(
        loginMessage,
        "جاري تسجيل الدخول...",
        "info"
    );

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        showMessage(
            loginMessage,
            "فشل تسجيل الدخول: " + error.message,
            "error"
        );

        return;
    }

    await checkAdmin(data.user);
}


/* =========================================================
   التحقق من المدير
========================================================= */

async function checkAdmin(user) {

    const { data, error } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();

    if (error) {

        showMessage(
            loginMessage,
            "حدث خطأ أثناء التحقق من صلاحية المدير.",
            "error"
        );

        console.error(error);

        return;
    }

    if (!data) {

        showMessage(
            loginMessage,
            "هذا الحساب ليس مديرًا.",
            "error"
        );

        await supabaseClient.auth.signOut();

        return;
    }

    loginBox.classList.add("hidden");

    adminBox.classList.remove("hidden");

    matchesBox.classList.remove("hidden");

    logoutBox.classList.remove("hidden");

    userInfo.textContent =
        "تم تسجيل الدخول كمدير: " + user.email;

    await loadMatches();

    await loadTeams();
}


/* =========================================================
   تحميل المباريات
========================================================= */

async function loadMatches() {

    matchesContainer.innerHTML =
        "جاري تحميل المباريات...";

    const { data, error } =
        await supabaseClient
            .from("matches")
            .select("*")
            .order(
                "match_date",
                {
                    ascending: true
                }
            );

    if (error) {

        matchesContainer.innerHTML =
            `<div class="message error">
                حدث خطأ أثناء تحميل المباريات:
                ${escapeHtml(error.message)}
            </div>`;

        console.error(error);

        return;
    }

    if (!data || data.length === 0) {

        matchesContainer.innerHTML =
            `<div class="message">
                لا توجد مباريات حاليًا.
            </div>`;

        return;
    }

    matchesContainer.innerHTML = "";

    data.forEach(match => {

        const div =
            document.createElement("div");

        div.className = "match";

        const homeScore =
            match.home_score ?? 0;

        const awayScore =
            match.away_score ?? 0;

        div.innerHTML = `

            <div class="match-title">

                <div class="teams">

                    <div class="team">
                        ${escapeHtml(match.home_team)}
                    </div>

                    <div class="vs">
                        🆚
                    </div>

                    <div class="team">
                        ${escapeHtml(match.away_team)}
                    </div>

                </div>

            </div>


            <div class="match-info">

                📅 التاريخ:
                ${escapeHtml(match.match_date || "-")}

                <br>

                🕐 الوقت:
                ${escapeHtml(match.match_time || "-")}

                <br>

                🏟️ الملعب:
                ${escapeHtml(match.stadium || "-")}

                <br>

                📌 الحالة:
                ${escapeHtml(match.status || "-")}

            </div>


            <div class="score">

                <div>

                    <label>
                        نتيجة ${escapeHtml(match.home_team)}
                    </label>

                    <input
                        type="number"
                        min="0"
                        id="home-${match.id}"
                        value="${homeScore}"
                    >

                </div>


                <div>

                    <label>
                        نتيجة ${escapeHtml(match.away_team)}
                    </label>

                    <input
                        type="number"
                        min="0"
                        id="away-${match.id}"
                        value="${awayScore}"
                    >

                </div>

            </div>


            <div class="score-actions">

                <button
                    class="save"
                    onclick="updateScore('${match.id}')"
                >
                    💾 حفظ النتيجة
                </button>

            </div>


            <div class="actions">

                <button
                    class="delete"
                    onclick="deleteMatch('${match.id}')"
                >
                    🗑️ حذف المباراة
                </button>

            </div>


            <div
                id="message-${match.id}"
                class="message"
            ></div>

        `;

        matchesContainer.appendChild(div);

    });
}


/* =========================================================
   حفظ النتيجة
========================================================= */

async function updateScore(matchId) {

    const homeInput =
        document.getElementById(
            "home-" + matchId
        );

    const awayInput =
        document.getElementById(
            "away-" + matchId
        );

    const message =
        document.getElementById(
            "message-" + matchId
        );

    const homeScore =
        Number(homeInput.value);

    const awayScore =
        Number(awayInput.value);

    if (
        !Number.isInteger(homeScore) ||
        homeScore < 0 ||
        !Number.isInteger(awayScore) ||
        awayScore < 0
    ) {

        showMessage(
            message,
            "النتيجة غير صحيحة.",
            "error"
        );

        return;
    }

    showMessage(
        message,
        "جاري حفظ النتيجة...",
        "info"
    );

    const { error } =
        await supabaseClient
            .from("matches")
            .update({
                home_score: homeScore,
                away_score: awayScore
            })
            .eq("id", matchId);

    if (error) {

        showMessage(
            message,
            "فشل الحفظ: " + error.message,
            "error"
        );

        console.error(error);

        return;
    }

    showMessage(
        message,
        "✅ تم حفظ النتيجة بنجاح.",
        "success"
    );
}


/* =========================================================
   إضافة مباراة
========================================================= */

async function addMatch() {

    const homeTeam =
        document
            .getElementById("homeTeam")
            .value
            .trim();

    const awayTeam =
        document
            .getElementById("awayTeam")
            .value
            .trim();

    const matchDate =
        document
            .getElementById("matchDate")
            .value;

    const matchTime =
        document
            .getElementById("matchTime")
            .value;

    const stadium =
        document
            .getElementById("stadium")
            .value
            .trim();

    const status =
        document
            .getElementById("matchStatus")
            .value;

    const message =
        document.getElementById(
            "addMatchMessage"
        );


    if (
        !homeTeam ||
        !awayTeam ||
        !matchDate ||
        !matchTime ||
        !stadium
    ) {

        showMessage(
            message,
            "أكمل جميع بيانات المباراة.",
            "error"
        );

        return;
    }


    showMessage(
        message,
        "جاري إضافة المباراة...",
        "info"
    );


    const { error } =
        await supabaseClient
            .from("matches")
            .insert({

                home_team: homeTeam,

                away_team: awayTeam,

                match_date: matchDate,

                match_time: matchTime,

                stadium: stadium,

                home_score: 0,

                away_score: 0,

                status: status

            });


    if (error) {

        showMessage(
            message,
            "فشل إضافة المباراة: " +
            error.message,
            "error"
        );

        console.error(error);

        return;
    }


    showMessage(
        message,
        "✅ تمت إضافة المباراة بنجاح.",
        "success"
    );


    document
        .getElementById("homeTeam")
        .value = "";

    document
        .getElementById("awayTeam")
        .value = "";

    document
        .getElementById("matchDate")
        .value = "";

    document
        .getElementById("matchTime")
        .value = "";

    document
        .getElementById("stadium")
        .value = "";

    await loadMatches();
}


/* =========================================================
   حذف مباراة
========================================================= */

async function deleteMatch(matchId) {

    const confirmed =
        confirm(
            "هل أنت متأكد أنك تريد حذف هذه المباراة؟"
        );

    if (!confirmed) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("matches")
            .delete()
            .eq("id", matchId);


    if (error) {

        alert(
            "فشل حذف المباراة:\n" +
            error.message
        );

        console.error(error);

        return;
    }


    alert(
        "✅ تم حذف المباراة."
    );


    await loadMatches();
}


/* =========================================================
   إضافة فريق
========================================================= */

async function addTeam() {

    const teamName =
        document
            .getElementById("teamName")
            .value
            .trim();

    const logoInput =
        document.getElementById("teamLogo");

    const message =
        document.getElementById("teamMessage");


    if (!teamName) {

        showMessage(
            message,
            "اكتب اسم الفريق.",
            "error"
        );

        return;
    }


    showMessage(
        message,
        "جاري إضافة الفريق...",
        "info"
    );


    let logoUrl = null;


    /* =========================
       رفع الشعار
    ========================== */

    if (
        logoInput.files &&
        logoInput.files.length > 0
    ) {

        const file =
            logoInput.files[0];


        const allowedTypes = [
            "image/png",
            "image/jpeg",
            "image/webp"
        ];


        if (
            !allowedTypes.includes(
                file.type
            )
        ) {

            showMessage(
                message,
                "نوع الشعار غير مسموح. استخدم PNG أو JPG أو WEBP.",
                "error"
            );

            return;
        }


        if (
            file.size >
            5 * 1024 * 1024
        ) {

            showMessage(
                message,
                "حجم الشعار يجب ألا يتجاوز 5 ميجابايت.",
                "error"
            );

            return;
        }


        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const fileName =
            "team-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2) +
            "." +
            extension;


        const filePath =
            "logos/" + fileName;


        const { error: uploadError } =
            await supabaseClient
                .storage
                .from("team-logos")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false
                    }
                );


        if (uploadError) {

            showMessage(
                message,
                "فشل رفع الشعار: " +
                uploadError.message,
                "error"
            );

            console.error(uploadError);

            return;
        }


        const { data } =
            supabaseClient
                .storage
                .from("team-logos")
                .getPublicUrl(filePath);


        logoUrl =
            data.publicUrl;
    }


    /* =========================
       حفظ الفريق
    ========================== */

    const { error } =
        await supabaseClient
            .from("teams")
            .insert({

                name: teamName,

                logo_url: logoUrl

            });


    if (error) {

        showMessage(
            message,
            "فشل حفظ الفريق: " +
            error.message,
            "error"
        );

        console.error(error);

        return;
    }


    showMessage(
        message,
        "✅ تمت إضافة الفريق بنجاح.",
        "success"
    );


    document
        .getElementById("teamName")
        .value = "";

    document
        .getElementById("teamLogo")
        .value = "";

    const preview =
        document.getElementById(
            "logoPreview"
        );

    preview.src = "";

    preview.style.display =
        "none";


    await loadTeams();
}


/* =========================================================
   تحميل الفرق
========================================================= */

async function loadTeams() {

    teamsList.innerHTML =
        "جاري تحميل الفرق...";


    const { data, error } =
        await supabaseClient
            .from("teams")
            .select("*")
            .order(
                "name",
                {
                    ascending: true
                }
            );


    if (error) {

        teamsList.innerHTML =
            `<div class="message error">
                فشل تحميل الفرق:
                ${escapeHtml(error.message)}
            </div>`;

        console.error(error);

        return;
    }


    if (!data || data.length === 0) {

        teamsList.innerHTML =
            `<div class="message">
                لا توجد فرق مضافة حتى الآن.
            </div>`;

        return;
    }


    teamsList.innerHTML = "";


    data.forEach(team => {

        const item =
            document.createElement("div");

        item.className =
            "team-item";


        const logo =
            team.logo_url
                ? `<img
                    src="${escapeHtml(team.logo_url)}"
                    alt="${escapeHtml(team.name)}"
                  >`
                : `<div
                    style="
                        width:55px;
                        height:55px;
                        border-radius:50%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:#f3f4f6;
                    "
                  >
                    ⚽
                  </div>`;


        item.innerHTML = `

            ${logo}

            <div class="team-item-name">

                ${escapeHtml(team.name)}

                <div class="small">
                    فريق أبيان سبورت
                </div>

            </div>

        `;


        teamsList.appendChild(item);

    });
}


/* =========================================================
   معاينة الشعار
========================================================= */

document
    .getElementById("teamLogo")
    .addEventListener(
        "change",
        function () {

            const file =
                this.files &&
                this.files[0];

            const preview =
                document.getElementById(
                    "logoPreview"
                );


            if (!file) {

                preview.src = "";

                preview.style.display =
                    "none";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    preview.src =
                        event.target.result;

                    preview.style.display =
                        "block";

                };


            reader.readAsDataURL(file);

        }
    );

========================================================= */

async function logout() {

    await supabaseClient.auth.signOut();

    adminBox.classList.add("hidden");

    addMatchBox.classList.add("hidden");

    teamsBox.classList.add("hidden");

    matchesBox.classList.add("hidden");

    logoutBox.classList.add("hidden");

    loginBox.classList.remove("hidden");

    loginMessage.textContent =
        "تم تسجيل الخروج.";

}


/* =========================================================
   الرسائل
========================================================= */

function showMessage(
    element,
    text,
    type = ""
) {

    element.textContent =
        text;

    element.className =
        "message " + type;

}


/* =========================================================
   حماية HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   فحص الجلسة عند فتح الصفحة
========================================================= */

async function checkSession() {

    const {
        data
    } =
        await supabaseClient
            .auth
            .getSession();


    if (
        data &&
        data.session &&
        data.session.user
    ) {

        await checkAdmin(
            data.session.user
        );

    }

}


checkSession();
